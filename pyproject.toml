[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projected-awf"
version = "1.1.0"
description = "Projected learned adversarial water-filling and reproducible experiments"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["mercury*"]
